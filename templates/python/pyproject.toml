[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acme-cli"
version = "1.0.0"
description = "Command line for Acme"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
acme = "acme.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
