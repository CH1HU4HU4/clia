name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Tests
        run: npm test
      - name: Package
        run: npm pack
      - name: Checksums
        run: sha256sum *.tgz > checksums.txt
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: acme-cli
          path: |
            *.tgz
            checksums.txt
