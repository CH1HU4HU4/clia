name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Vet
        run: go vet ./...
      - name: Tests
        run: go test ./...
      - name: Build
        run: go build -trimpath -ldflags "-s -w" -o dist/acme ./cmd/acme
      - name: Checksums
        run: sha256sum dist/acme > dist/checksums.txt
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: acme-cli
          path: dist/
